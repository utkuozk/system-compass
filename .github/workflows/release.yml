name: Build, test and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.203
      - name: Build
        shell: pwsh
        run: |
          dotnet restore
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet publish -c Release --no-restore -o artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Verify
        shell: pwsh
        run: |
          $p = Start-Process artifacts/app/SistemPusulasi.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content artifacts/app/self-test-results.txt
          if ($p.ExitCode -ne 0) { throw 'Self-tests failed' }
          foreach ($file in Get-ChildItem Diagnostics,Updates,Security -Filter *.ps1) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax errors: $($file.Name)" }
          }
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project=Get-Content SistemPusulasi.csproj
          $version=[string]$project.Project.PropertyGroup.Version
          $parsed=[version]$version
          $asset="Sistem-Pusulasi-$($parsed.Major).$($parsed.Minor).zip"
          Copy-Item artifacts/app/SistemPusulasi.exe artifacts/app/SistemPusulasi-Kur.exe
          Copy-Item KULLANIM.txt artifacts/app/KULLANIM.txt
          $files=Get-ChildItem artifacts/app -File | Where-Object Extension -ne '.pdb'
          Compress-Archive -Path $files.FullName -DestinationPath "artifacts/$asset"
          $digest=(Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content "artifacts/$asset.sha256" -Encoding utf8
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; increment the project version.' }
          gh release create "v$version" "artifacts/$asset" "artifacts/$asset.sha256" --target $env:GITHUB_SHA --title "System Compass $version" --notes-file RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
