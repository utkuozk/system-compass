name: Build, test and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.203
      - name: Build
        shell: pwsh
        run: |
          dotnet restore
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet publish -c Release --no-restore -o artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Verify
        shell: pwsh
        run: |
          $p = Start-Process artifacts/app/SistemPusulasi.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content artifacts/app/self-test-results.txt
          if ($p.ExitCode -ne 0) { throw 'Self-tests failed' }
          foreach ($file in Get-ChildItem Diagnostics,Updates,Security -Filter *.ps1) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax errors: $($file.Name)" }
          }
      - name: Build standalone Windows installer
        shell: pwsh
        run: |
          [xml]$project=Get-Content SistemPusulasi.csproj
          $version=[string]$project.Project.PropertyGroup.Version
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/setup-app
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained publish failed' }
          Copy-Item KULLANIM.txt artifacts/setup-app/KULLANIM.txt
          $p=Start-Process artifacts/setup-app/SistemPusulasi.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content artifacts/setup-app/self-test-results.txt; throw 'Standalone self-tests failed' }
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $compiler "/DAppVersion=$version" "/DPublishDir=$((Resolve-Path artifacts/setup-app).Path)" "/DOutputDir=$((Resolve-Path artifacts).Path)" installer/SystemCompass.iss
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }
          $setup="artifacts/System-Compass-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw 'Setup EXE missing' }
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($setup))" | Set-Content "$setup.sha256" -Encoding utf8
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project=Get-Content SistemPusulasi.csproj
          $version=[string]$project.Project.PropertyGroup.Version
          $parsed=[version]$version
          $asset="Sistem-Pusulasi-$($parsed.Major).$($parsed.Minor).zip"
          Copy-Item artifacts/app/SistemPusulasi.exe artifacts/app/SistemPusulasi-Kur.exe
          Copy-Item KULLANIM.txt artifacts/app/KULLANIM.txt
          $files=Get-ChildItem artifacts/app -File | Where-Object Extension -ne '.pdb'
          Compress-Archive -Path $files.FullName -DestinationPath "artifacts/$asset"
          $digest=(Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content "artifacts/$asset.sha256" -Encoding utf8
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; increment the project version.' }
          gh release create "v$version" "artifacts/System-Compass-Setup-$version.exe" "artifacts/System-Compass-Setup-$version.exe.sha256" "artifacts/$asset" "artifacts/$asset.sha256" --target $env:GITHUB_SHA --title "System Compass $version" --notes-file RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
